AWSTemplateFormatVersion: "2010-09-09"
Description: DSA Daily static web application and serverless progress API
Transform: AWS::Serverless-2016-10-31

Parameters:
  EnableCustomDomain:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to true after supplying the domain, certificate, and hosted zone parameters.
  AppDomainName:
    Type: String
    Default: ""
    Description: Fully qualified domain name for the app, for example dsa.example.com.
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:225989371926:certificate/73206bd1-9902-4c9e-92e5-8489a10b6f26
    AllowedPattern: "^arn:aws[a-zA-Z-]*:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$"
    Description: ARN of an ACM certificate in us-east-1 that covers AppDomainName.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 public hosted zone ID for AppDomainName.
  WebOrigin:
    Type: String
    Default: https://dsa.castrodavid.dev
    AllowedPattern: "^https://[a-z0-9.-]+$"
    Description: Production browser origin allowed to call the API.
  ExistingUserPoolId:
    Type: String
    Default: us-east-2_7LKDrgjB7
    AllowedPattern: "^us-east-2_[A-Za-z0-9]+$"
    Description: Existing us-east-2 Cognito user pool shared with this application.

Conditions:
  HasCustomDomain: !Equals [!Ref EnableCustomDomain, "true"]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: dsa-daily
        - Key: ManagedBy
          Value: CloudFormation

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: !Sub "Private S3 access for ${AWS::StackName}"
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  NoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-html-no-cache"
        Comment: HTML is revalidated so new deployments appear immediately.
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  StaticAssetsCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-static-assets"
        Comment: Vite assets are content-hashed and safe to cache for one year.
        DefaultTTL: 31536000
        MaxTTL: 31536000
        MinTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: Project
          Value: dsa-daily
        - Key: ManagedBy
          Value: CloudFormation
      DistributionConfig:
        Aliases: !If
          - HasCustomDomain
          - [!Ref AppDomainName]
          - !Ref AWS::NoValue
        Comment: !Sub "${AWS::StackName} static site"
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: !Ref NoCachePolicy
          Compress: true
          TargetOriginId: SiteOrigin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: SiteOrigin
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: {}
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
        CacheBehaviors:
          - AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticAssetsCachePolicy
            Compress: true
            PathPattern: assets/*
            TargetOriginId: SiteOrigin
            ViewerProtocolPolicy: redirect-to-https

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  DomainRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref AppDomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref AppDomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

  SpaUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      AccessTokenValidity: 1
      AuthSessionValidity: 3
      ClientName: !Sub "${AWS::StackName}-spa"
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      GenerateSecret: false
      IdTokenValidity: 1
      PreventUserExistenceErrors: ENABLED
      ReadAttributes:
        - email
        - email_verified
      RefreshTokenValidity: 30
      SupportedIdentityProviders:
        - COGNITO
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      UserPoolId: !Ref ExistingUserPoolId

  ProgressTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-progress"
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: dsa-daily
        - Key: ManagedBy
          Value: CloudFormation

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/api-gateway/${AWS::StackName}"
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: dsa-daily
        - Key: ManagedBy
          Value: CloudFormation

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}'
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              audience:
                - !Ref SpaUserPoolClient
              issuer: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${ExistingUserPoolId}"
        DefaultAuthorizer: CognitoJwtAuthorizer
      CorsConfiguration:
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - DELETE
          - GET
          - PATCH
          - POST
        AllowOrigins:
          - !Ref WebOrigin
          - http://localhost:3000
          - http://localhost:5173
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      StageName: $default
      Tags:
        Project: dsa-daily
        ManagedBy: CloudFormation

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: dsa-daily
        - Key: ManagedBy
          Value: CloudFormation

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-api-${AWS::Region}"
      Description: Reads and updates DSA Daily progress for authenticated users.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dsa-daily-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-api:*"
              - Sid: ManageUserProgress
                Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource: !GetAtt ProgressTable.Arn
              - Sid: PublishTraces
                Effect: Allow
                Action:
                  - xray:PutTelemetryRecords
                  - xray:PutTraceSegments
                Resource: "*"
      Tags:
        - Key: Project
          Value: dsa-daily
        - Key: ManagedBy
          Value: CloudFormation

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiFunctionLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handler.ts
        Minify: true
        Sourcemap: true
        Target: es2022
    Properties:
      Architectures:
        - arm64
      CodeUri: backend/
      Description: Authenticated DSA Daily progress API.
      Environment:
        Variables:
          POWERTOOLS_LOG_LEVEL: INFO
          POWERTOOLS_SERVICE_NAME: dsa-daily-api
          TABLE_NAME: !Ref ProgressTable
      Events:
        GetProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/progress
            PayloadFormatVersion: "2.0"
        RepairProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PATCH
            Path: /v1/progress
            PayloadFormatVersion: "2.0"
        ImportProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /v1/progress/import
            PayloadFormatVersion: "2.0"
        LogSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /v1/sessions
            PayloadFormatVersion: "2.0"
        ListSessions:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/sessions
            PayloadFormatVersion: "2.0"
        CreateManualSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /v1/sessions/manual
            PayloadFormatVersion: "2.0"
        UpdateSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PATCH
            Path: /v1/sessions/{cycle}/{problemIndex}
            PayloadFormatVersion: "2.0"
        DeleteSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /v1/sessions/{cycle}/{problemIndex}
            PayloadFormatVersion: "2.0"
        UndoProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /v1/progress/undo
            PayloadFormatVersion: "2.0"
      FunctionName: !Sub "${AWS::StackName}-api"
      Handler: src/handler.handler
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        SystemLogLevel: INFO
      MemorySize: 512
      Role: !GetAtt ApiFunctionRole.Arn
      Runtime: nodejs24.x
      Timeout: 10
      Tracing: Active
      Tags:
        Project: dsa-daily
        ManagedBy: CloudFormation

Outputs:
  SiteBucketName:
    Description: S3 bucket that receives the Vite build output.
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID used for cache invalidations.
    Value: !Ref Distribution
  DistributionUrl:
    Description: Default CloudFront URL for the application.
    Value: !Sub "https://${Distribution.DomainName}"
  SiteUrl:
    Description: Preferred URL for the application.
    Value: !If
      - HasCustomDomain
      - !Sub "https://${AppDomainName}"
      - !Sub "https://${Distribution.DomainName}"
  ApiUrl:
    Description: Authenticated HTTP API base URL.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  CognitoUserPoolId:
    Description: Existing Cognito user pool used for authentication.
    Value: !Ref ExistingUserPoolId
  CognitoUserPoolClientId:
    Description: Public SPA app client owned by this stack.
    Value: !Ref SpaUserPoolClient
  ProgressTableName:
    Description: DynamoDB table that stores per-user progress and sessions.
    Value: !Ref ProgressTable
