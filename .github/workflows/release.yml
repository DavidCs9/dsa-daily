name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bootstrap: ${{ steps.classify.outputs.bootstrap }}
      deploy: ${{ steps.classify.outputs.deploy }}
      frontend: ${{ steps.classify.outputs.frontend }}
      infrastructure: ${{ steps.classify.outputs.infrastructure }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi

          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          node scripts/classify-changes.mjs "${changed_files[@]}"

  quality:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate infrastructure
        run: |
          npm run infra:validate
          sam validate --template-file bootstrap/github-release.yaml --region us-east-1

  deploy:
    if: >-
      github.event_name == 'push' &&
      needs.changes.outputs.deploy == 'true'
    needs: [changes, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: dsa-daily-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify deployment configuration
        env:
          APP_CERTIFICATE_ARN: ${{ vars.APP_CERTIFICATE_ARN }}
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
        run: |
          for name in AWS_DEPLOY_ROLE_ARN APP_CERTIFICATE_ARN APP_DOMAIN_NAME HOSTED_ZONE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository variable: $name" >&2
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: dsa-daily-release
          aws-region: us-east-2

      - name: Deploy infrastructure
        if: needs.changes.outputs.infrastructure == 'true'
        run: >-
          aws cloudformation deploy
          --template-file template.yaml
          --stack-name dsa-daily
          --region us-east-2
          --no-fail-on-empty-changeset
          --parameter-overrides
          EnableCustomDomain=true
          AppDomainName=${{ vars.APP_DOMAIN_NAME }}
          CertificateArn=${{ vars.APP_CERTIFICATE_ARN }}
          HostedZoneId=${{ vars.HOSTED_ZONE_ID }}

      - name: Publish static files
        run: npm run publish
